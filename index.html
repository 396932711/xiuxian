<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宗门</title>
<!-- 配置加载器：从 assets/config/*.json 读取；file:/// 下 CORS 失败则自动回退到内嵌默认值 -->
<script src="assets/config.js"></script>
<style>
  /* ===== 全局与主题（主题色与 UI 尺寸均由 ConfigLoader 注入 CSS 变量覆盖） ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root{
    /* 主题色（会被 ui.json.themeColors 的 injectThemeColors 覆盖） */
    --qing:#3FA89A; --wood:#B58A4E; --gold:#E8B84E; --gold-soft:#f7e5b8;
    --ink:#3A4A5A;   --cloud:#F4F7F4;
    --panel:rgba(244,247,244,.94);
    --line:rgba(58,74,90,.16);
    /* UI 尺寸 tokens（会被 ui.json.layoutTokens 的 injectLayoutTokens 覆盖） */
    --l-topbar_padding:6px 10px; --l-topbar_gap:10px; --l-topbar_border_width:1.5px;
    --l-leader_entry_scale:1; --l-leader_avatar_size:32px;
    --l-leader_name_size:13px; --l-leader_lv_size:10px;
    --l-sect_name_size:15px; --l-sect_badge_pad:1px 6px; --l-sect_badge_fs:11px;
    --l-res_pill_pad:3px 8px; --l-res_pill_fs:13px; --l-res_icon_size:18px;
    --l-bottombar_padding:4px 6px; --l-bottombar_border_w:1.5px;
    --l-bottombar_btn_pad:7px 4px; --l-bottombar_btn_fs:12px;
    --l-bottombar_btn_radius:8px; --l-bottombar_btn_margin:0 3px; --l-bottombar_gap:2px;
    --l-scene_padding:12px 16px; --l-scene_min_h:0;
    --l-building_card_pad:6px; --l-building_card_radius:12px;
    --l-building_card_border:1.5px solid var(--line);
    --l-building_card_bg:rgba(244,247,244,.90);
    --l-building_card_shadow:0 4px 10px rgba(0,0,0,.10);
    --l-building_img_height:58%; --l-building_img_radius:8px;
    --l-building_name_fs:13px; --l-building_sub_fs:11px;
    --l-building_gap_px:8;
    --l-building_mode:positional;
    --l-building_default_w:18%; --l-building_default_h:30%;
    --l-modal_max_w:440px; --l-modal_padding:14px 16px; --l-modal_radius:14px; --l-modal_title_fs:16px;
    --l-btn_pad:8px 14px; --l-btn_radius:8px; --l-btn_fs:13px;
    --l-info_row_pad:6px 0; --l-info_row_fs:13px;
    --l-toast_bottom:72px;
    --l-building_mode_valid:positional;
  }
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    background:#cfe8e1 url("assets/img/scene_bg.jpg") center/cover no-repeat fixed;
    overflow:hidden;
    user-select:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;outline:none;}

  /* ===== 主界面布局 ===== */
  #app{display:flex;flex-direction:column;height:100%;}
  #topbar{
    display:flex;align-items:center;gap:var(--l-topbar_gap);
    padding:var(--l-topbar_padding);
    background:linear-gradient(180deg,rgba(244,247,244,.98),rgba(244,247,244,.82));
    border-bottom:var(--l-topbar_border_width) solid var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.08);
    z-index:5;flex-wrap:wrap;
  }
  /* 掌门入口（左上角，顶栏第1位） */
  .leader-entry{
    display:flex;align-items:center;gap:8px;padding:3px 8px 3px 3px;
    background:linear-gradient(135deg,#fff8e0,#fce7a8);border:calc(var(--l-topbar_border_width) + 0.5px) solid var(--gold);
    border-radius:999px;cursor:pointer;transition:transform .1s;box-shadow:0 2px 6px rgba(232,184,78,.35);
    transform:scale(var(--l-leader_entry_scale));transform-origin:left center;
  }
  .leader-entry:hover{transform:translateY(-1px) scale(var(--l-leader_entry_scale));}
  .leader-entry img.l-avatar{width:var(--l-leader_avatar_size);height:var(--l-leader_avatar_size);border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 2px var(--gold);}
  .leader-entry .l-meta{line-height:1.2;}
  .leader-entry .l-name{font-weight:700;font-size:var(--l-leader_name_size);color:#8a6310;display:flex;align-items:center;gap:4px;}
  .leader-entry .l-badge{font-size:calc(var(--l-leader_name_size) - 4px);background:var(--gold);color:#fff;padding:1px 4px;border-radius:999px;}
  .leader-entry .l-lv{font-size:var(--l-leader_lv_size);color:#8a6310;opacity:.85;}

  .sect-name{font-weight:700;font-size:var(--l-sect_name_size);color:var(--qing);margin-left:4px;display:flex;align-items:center;gap:6px;}
  .sect-level{font-size:var(--l-sect_badge_fs);background:var(--qing);color:#fff;padding:var(--l-sect_badge_pad);border-radius:999px;}
  .spacer{flex:1;}
  .res{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:var(--l-res_pill_pad);font-weight:600;font-size:var(--l-res_pill_fs);}
  .res img{width:var(--l-res_icon_size);height:var(--l-res_icon_size);}

  /* 场景：给建筑卡片绝对定位；背景图作为整张画布 */
  #scene{flex:1;position:relative;overflow:hidden;padding:var(--l-scene_padding);min-height:var(--l-scene_min_h);}
  .buildings{position:absolute;inset:var(--l-scene_padding);}
  /* 建筑卡片：两种模式：positional（绝对定位对齐背景图，推荐） / flex（老模式居中平铺） */
  .buildings.mode-flex{position:static;display:flex;gap:var(--l-building_gap_px) px;flex-wrap:wrap;justify-content:center;align-items:center;}
  .buildings.mode-flex .b-card{position:static;transform:none;width:180px;height:auto;}
  .b-card{
    position:absolute;
    padding:var(--l-building_card_pad);
    background:var(--l-building_card_bg);
    border:var(--l-building_card_border);
    border-radius:var(--l-building_card_radius);
    box-shadow:var(--l-building_card_shadow);
    transition:transform .12s, box-shadow .12s, filter .12s;
    overflow:hidden;
    display:flex;flex-direction:column;align-items:stretch;
    cursor:pointer;
    backdrop-filter: blur(2px);
  }
  .b-card:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 18px rgba(0,0,0,.16);border-color:var(--gold);}
  .b-card img.b-img{
    width:100%;height:100%;flex:1 1 100%;object-fit:cover;border-radius:var(--l-building_img_radius);
    min-height:0;
  }
  .b-card .b-label{display:none;}
  .b-card .b-name{display:none;}
  .b-card .b-sub{display:none;}
  /* labelPosition 相关样式保留但 label 已隐藏，不影响布局 */
  .b-card.lbl-top,.b-card.lbl-left,.b-card.lbl-right{flex-direction:column;}

  #bottombar{
    display:flex;align-items:stretch;gap:var(--l-bottombar_gap);
    background:var(--panel);
    border-top:var(--l-bottombar_border_w) solid var(--gold);
    padding:var(--l-bottombar_padding);
    z-index:5;
  }
  .nav-btn{flex:1;padding:var(--l-bottombar_btn_pad);font-size:var(--l-bottombar_btn_fs);color:var(--ink);background:transparent;border-radius:var(--l-bottombar_btn_radius);margin:var(--l-bottombar_btn_margin);transition:background .12s;min-height:0;line-height:1.2;}
  .nav-btn:hover{background:rgba(232,184,78,.18);}
  .nav-btn.active{background:var(--qing);color:#fff;font-weight:700;}

  /* ===== 弹窗 ===== */
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:1000;align-items:center;justify-content:center;}
  #overlay.show{display:flex;}
  .modal{
    width:min(var(--l-modal_max_w),92vw);max-height:86vh;overflow:auto;background:var(--cloud);
    border:2px solid var(--gold);border-radius:var(--l-modal_radius);padding:var(--l-modal_padding);
    box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal h2{font-size:var(--l-modal_title_fs);color:var(--qing);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .modal .close{font-size:22px;color:#9aa;background:none;line-height:1;padding:0 4px;}
  .modal .m-sub{font-size:calc(var(--l-info_row_fs) - 1px);color:#6a7a86;margin-bottom:12px;}
  .info-row{display:flex;justify-content:space-between;padding:var(--l-info_row_pad);border-bottom:1px dashed var(--line);font-size:var(--l-info_row_fs);gap:10px;flex-wrap:wrap;}
  .info-row span:last-child{font-weight:600;text-align:right;}
  .btn{
    display:inline-block;padding:var(--l-btn_pad);border-radius:var(--l-btn_radius);font-size:var(--l-btn_fs);font-weight:600;
    background:var(--gold);color:#fff;transition:filter .12s,transform .1s;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:scale(.97);}
  .btn.wood{background:var(--wood);}
  .btn.qing{background:var(--qing);}
  .btn.gray{background:#bcc4cc;cursor:not-allowed;}
  .btn.full{display:block;width:100%;margin-top:10px;}
  .btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

  /* 掌门详情：大头像卡 */
  .leader-banner{text-align:center;padding:4px 0 10px;border-bottom:1px dashed var(--line);margin-bottom:10px;}
  .leader-banner img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 3px var(--gold);}
  .leader-banner .r-name{font-size:calc(var(--l-modal_title_fs) + 2px);font-weight:700;color:var(--qing);margin-top:8px;display:flex;justify-content:center;align-items:center;gap:6px;}
  .tag-gold{font-size:11px;background:var(--gold);color:#fff;padding:2px 8px;border-radius:999px;font-weight:700;}
  .leader-banner .r-sub{font-size:12px;color:#6a7a86;}
  .expbar{height:8px;border-radius:999px;background:#e1e7e9;overflow:hidden;margin:6px 0 2px;}
  .expbar>div{height:100%;background:linear-gradient(90deg,var(--qing),#9ad5c8);}
  .hint{font-size:12px;color:var(--qing);margin-top:4px;}
  .hint-warn{font-size:12px;color:#c44;margin-top:4px;}

  /* 弟子列表（掌门置顶+金描边） */
  .d-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .d-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;transition:border-color .1s,transform .08s;}
  .d-item:hover{border-color:var(--qing);}
  .d-item.is-leader{background:linear-gradient(135deg,#fffbe6,#f9ecbc);border:2px solid var(--gold);cursor:pointer;}
  .d-item img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#eef;}
  .d-item.is-leader img{box-shadow:0 0 0 2px var(--gold);}
  .d-item .d-info{flex:1;min-width:0;}
  .d-item .d-name{font-weight:700;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .d-item .d-meta{font-size:12px;color:#6a7a86;}
  .d-item .d-tag{font-size:11px;padding:2px 8px;border-radius:999px;}
  .tag-idle{background:#e8eee8;color:#5a7a5a;}
  .tag-mining{background:#e3f0ee;color:var(--qing);}
  .d-empty{text-align:center;color:#9aa;font-size:13px;padding:24px 0;}

  .recruit-result{text-align:center;padding:10px 0;}
  .recruit-result img{width:90px;height:90px;border-radius:50%;object-fit:cover;animation:glow 1s ease;}
  @keyframes glow{0%{box-shadow:0 0 0 0 rgba(232,184,78,.7);}100%{box-shadow:0 0 0 20px rgba(232,184,78,0);}}
  .recruit-result .r-name{font-size:18px;font-weight:700;color:var(--qing);margin:8px 0 2px;}

  input.txt{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;}
  .toast{position:fixed;bottom:var(--l-toast_bottom);left:50%;transform:translateX(-50%);background:rgba(58,74,90,.92);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .cfg-bar{font-size:11px;color:#8a9a9a;padding:2px 8px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--panel);}
  .cfg-bar code{background:#eef3f0;border-radius:4px;padding:0 4px;color:#455;}

  /* 隐藏原生 file input */
  #fileUpload{display:none;}
  #saveImport{display:none;}
  .danger{background:#D9534F!important;color:#fff!important;font-weight:700;}
  .muted{color:#6a7a86;font-size:12px;margin-top:4px;display:block;}
  .card-block{padding:12px 14px;background:rgba(244,247,244,.7);border:1px dashed var(--line);border-radius:12px;margin:10px 0;}
  .card-block h3{margin:0 0 4px;font-size:14px;color:var(--qing);}
  .sect-meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px;}
  .sect-meta-grid div{padding:6px 8px;background:#fff;border-radius:8px;border:1px solid var(--line);font-size:12px;}
  .sect-meta-grid strong{display:block;color:var(--ink);font-size:14px;margin-top:2px;}
  /* 任务进度条：唯一新增的弹窗级小 class */
  .quest-bar{width:100%;height:8px;background:rgba(58,74,90,.08);border-radius:4px;overflow:hidden;}
  .quest-bar .fill{height:100%;background:linear-gradient(90deg,var(--qing),var(--gold));transition:width .25s;}
  /* 顶栏资源胶囊弹性排列（灵石/灵药/丹药 3 个） */
  .res-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="leader-entry" id="leaderEntry" onclick="openLeaderDetail()">
      <img class="l-avatar" id="leaderAvatar" alt="掌门">
      <div class="l-meta">
        <div class="l-name"><span id="leaderName"></span><span class="l-badge">掌门</span></div>
        <div class="l-lv" id="leaderLv"></div>
      </div>
    </div>
    <div class="sect-name"><span id="sectName"></span><span class="sect-level" id="sectLevel"></span></div>
    <div class="spacer"></div>
    <div class="res-wrap" id="resWrap"><div class="res"><img id="iconLingshi" alt="灵石"><span id="lingshi">0</span></div></div>
  </header>
  <main id="scene">
    <div class="buildings" id="buildings"></div>
  </main>
  <nav id="bottombar">
    <!-- 底部导航按钮由 renderBottomNav() 按 uiText.bottomNav 数组动态渲染，支持自定义顺序 -->
  </nav>
</div>
<div id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileUpload" accept="image/*">
<input type="file" id="saveImport" accept="application/json,.json">

<script>
/* ============================================================
 * 宗门 v1.2 — 全部参数外置可配置
 * 加载顺序：
 *   1. assets/config.js（ConfigLoader：6 份 JSON + fallback 默认值 + 校验 + helpers）
 *   2. await loadAll() -> 主题色注入 -> 背景/图标按配置换 -> init() -> tick()
 * 业务代码严禁再写死数值常量，统一走 window.GameConfig / H（helpers）
 * ============================================================ */

/* ===== 0. 全局句柄（配置加载完成后赋值） ===== */
let GameConfig = null;  // {values, buildings, realms, nameLib, ui, resources}
let H = null;           // helpers（producePer10s / upgradeCost / expNeeded / ...）
let state = null;
let fileInput = null;
let loadDiagnostics = null; // {sourceMap, warnings, usedFallback}
let running = false;

/* ===== 1. Save（基于 GameConfig 读取存档键 + 旧档兼容升级） ===== */
function makeLeader(){
  const V = GameConfig.values;
  return {
    id:"d_0",
    name: V.leader.defaultName,
    realm: GameConfig.realms.order[0] in GameConfig.realms.realms
      ? GameConfig.realms.realms[GameConfig.realms.order[0]].name
      : "练气",
    level:1, exp:0,
    status:"idle", assignTo:null,
    base:{root: V.leader.root},
    isLeader:true, avatarDataUrl:null
  };
}
function newGame(){
  const V = GameConfig.values;
  // 初始建筑：按 buildings.order 列表建立（保证新增配置后自动支持）
  const buildings = {};
  for(const key of GameConfig.buildings.order){
    if(key==="dian")       buildings[key] = { level: 1 };
    else if(key==="kuang") buildings[key] = { level: 1, workerIds: [] };
    else if(key==="zhaomu")buildings[key] = { level: 1, refreshCdEnd: 0 };
    else if(key==="yaotian") buildings[key] = { level:1, workerIds:[] };
    else if(key==="danfang") buildings[key] = { level:1, workerIds:[] };
    else if(key==="cangjing")buildings[key] = { level:1 };
    else                   buildings[key] = { level: 1 };
  }
  // 初始资源：按 resources.order，灵石用 initialValue，其它初始 0
  const resources = {};
  for(const key of GameConfig.resources.order){
    const r = GameConfig.resources.resources[key];
    resources[key] = r.initialValue || 0;
  }
  return {
    version:"1.3",
    lastSaveTime:Date.now(),
    sect:{ name: GameConfig.ui.sect.defaultName },
    resources,
    buildings,
    leader: makeLeader(),
    disciples:[],
    nextDiscipleId:1,
    quests: { date:"", list:[] }
  };
}
function loadGame(){
  try{
    const raw = localStorage.getItem(GameConfig.values.storageKey);
    if(!raw) return null;
    const s = JSON.parse(raw);
    // 旧档升级：没有 leader 字段 → 补默认掌门
    if(!s.leader){ s.leader = makeLeader(); }
    s.leader.isLeader = true;
    s.leader.base = s.leader.base || { root: GameConfig.values.leader.root };
    if(!s.leader.assignTo) s.leader.assignTo = null;
    // 旧档：resources/sect/buildings 兜底
    const tmpl = newGame();
    s.sect      = s.sect      || tmpl.sect;
    s.resources = Object.assign(tmpl.resources, s.resources || {});
    s.buildings = s.buildings || tmpl.buildings;
    for(const k of GameConfig.buildings.order){
      if(!s.buildings[k]) s.buildings[k] = tmpl.buildings[k];
      if(k==="kuang" && !Array.isArray(s.buildings.kuang.workerIds)) s.buildings.kuang.workerIds = [];
      if(k==="zhaomu" && typeof s.buildings.zhaomu.refreshCdEnd!=="number") s.buildings.zhaomu.refreshCdEnd = 0;
    }
    // Task2 迁移：新建筑 + quests + disciple realm 兜底
    if(!s.buildings.yaotian) s.buildings.yaotian = { level:1, workerIds:[] };
    if(!s.buildings.danfang) s.buildings.danfang = { level:1, workerIds:[] };
    if(!s.buildings.cangjing) s.buildings.cangjing = { level:1 };
    if(!Array.isArray(s.buildings.yaotian.workerIds)) s.buildings.yaotian.workerIds = [];
    if(!Array.isArray(s.buildings.danfang.workerIds)) s.buildings.danfang.workerIds = [];
    if(!s.quests || typeof s.quests!=="object") s.quests = { date:"", list:[] };
    if(!s.disciples) s.disciples = [];
    s.disciples.forEach(function(d){ if(!d.realm) d.realm = GameConfig.realms.order[0]; });
    if(s.leader){
      if(!s.leader.realm) s.leader.realm = GameConfig.realms.order[0];
      s.leader.isLeader = true;
      s.leader.base = s.leader.base || { root: GameConfig.values.leader.root };
    }
    s.disciples = Array.isArray(s.disciples)?s.disciples:[];
    s.nextDiscipleId = s.nextDiscipleId || (s.disciples.length+1);
    return s;
  }catch(e){ return null; }
}
function saveGame(){
  state.lastSaveTime = Date.now();
  try{
    localStorage.setItem(GameConfig.values.storageKey, JSON.stringify(state));
  }catch(e){
    // 存档溢出：优先清掌门 DataURL 再存一次
    if(state.leader && state.leader.avatarDataUrl){
      state.leader.avatarDataUrl = null;
      try{
        localStorage.setItem(GameConfig.values.storageKey, JSON.stringify(state));
        toast("存档空间不足，已重置掌门自定义头像");
      }catch(e2){}
    }
  }
}

/* ===== 1.1 SaveIO：导出 / 导入 / 重置存档 ===== */
let saveImportInput = null;
function setupSaveImportHandler(){
  saveImportInput = document.getElementById("saveImport");
  if(!saveImportInput) return;
  saveImportInput.addEventListener("change", e=>{
    const f = e.target.files[0];
    saveImportInput.value = "";
    if(!f) return;
    const reader = new FileReader();
    reader.onerror = ()=>toast("读取文件失败，请换一个存档文件");
    reader.onload = evt=>{
      try{
        const raw = JSON.parse(String(evt.target.result || ""));
        // 支持两种格式：①新版包壳 {__zongmen_save__, meta, data}  ② 直接 localStorage 的 data 对象（家长 F12 手动备份出来的也能导入）
        const data = raw && typeof raw === "object" && raw.__zongmen_save__ === true && raw.data
          ? raw.data
          : raw;
        if(!isValidSaveObject(data)){ toast(GameConfig.ui.uiText.importInvalid || "文件内容不是有效的宗门存档"); return; }
        localStorage.setItem(GameConfig.values.storageKey, JSON.stringify(data));
        toast(GameConfig.ui.uiText.importSuccess || "导入成功，正在载入进度…");
        setTimeout(()=>location.reload(), 450);
      }catch(err){
        toast(GameConfig.ui.uiText.importInvalid || "文件内容不是有效的宗门存档");
      }
    };
    reader.readAsText(f, "utf-8");
  });
}
// 校验对象至少含有一份"宗门存档"必需字段，避免错把配置 JSON 导进来
function isValidSaveObject(o){
  if(!o || typeof o!=="object") return false;
  if(!o.sect || typeof o.sect.name!=="string") return false;
  if(!o.leader || typeof o.leader!=="object" || o.leader.id!=="d_0") return false;
  if(!o.resources || typeof o.resources!=="object") return false;
  if(!o.buildings || typeof o.buildings!=="object") return false;
  if(!Array.isArray(o.disciples)) return false;
  if(typeof o.nextDiscipleId!=="number" && typeof o.nextDiscipleId!=="string") return false;
  return true;
}
function saveFileName(){
  const S = GameConfig.values.saveFile;
  const prefix = (S.exportNamePrefix || "宗门-存档");
  const leader = state?.leader?.name || "掌门";
  const sect   = state?.sect?.name  || "无名宗门";
  const dt = new Date();
  const pad = n=>String(n).padStart(2,"0");
  const date = `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}-${pad(dt.getHours())}${pad(dt.getMinutes())}`;
  const sanitize = s=>(s||"").replace(/[\\/:*?"<>|]/g,"_").slice(0,18);
  return `${prefix}-${sanitize(sect)}-${sanitize(leader)}-${date}.json`;
}
function exportSaveFile(){
  if(!state){ toast("存档尚未准备好，请稍候再试"); return; }

/* ===== 2. 公式（统一走 helpers） ===== */
function producePer10s(d){ return H.producePer10s(d, realmCodeOfName(d.realm)); }
function upgradeCost(level){ return H.upgradeCost(level); }
function expNeeded(level){ return H.expNeeded(realmCodeOfName(state?.leader?.realm||GameConfig.realms.order[0]), level); }
function discipleCap(){ return H.discipleCap(state.buildings.dian.level); }
function kuangCap(){ return bldSlotCap("kuang"); }
function recruitCdSec(){ return H.recruitCdSec(state.buildings.zhaomu.level); }
function leaderOnDuty(){ return Array.isArray(state.buildings.kuang.workerIds) && state.buildings.kuang.workerIds.includes("d_0"); }
function moraleMul(){ return H.moraleMul(leaderOnDuty()); }
function getEntity(id){ return id==="d_0" ? state.leader : state.disciples.find(x=>x.id===id); }
function leaderAvatarSrc(){

}
function realmNameToCodeMap(){
  const m = {};

  return m;
}
function realmCodeOfName(name){
  const m = realmNameToCodeMap();
  return m[name] || GameConfig.realms.order[0];
}
/* ---- Task2/3/4/6: 新 helpers alias ---- */
function lingyaoPer10s(d){ return H.lingyaoPer10s(d, realmCodeOfName(d.realm)); }
function alchemyRecipe(buildingKey){ return H.alchemyRecipe(buildingKey); }
function breakthroughRate(realmId, add){ return H.breakthroughSuccessRate(realmId, add); }
function cangjingExpMul(){ return H.cangjingExpMul(state.buildings.cangjing.level); }
function bldSlotCap(key){ return H.slotCap(key, state.buildings[key].level); }
/* ---- 大殿等级驱动的阶段判定（用于资源解锁显示）---- */
function currentStageByDian(){

/* ===== 3. 离线结算 ===== */
function settleOffline(){
  const now = Date.now();
  const offlineMs = Math.min(now - state.lastSaveTime, GameConfig.values.offlineCapSeconds*1000);
  const ticks = Math.floor(offlineMs / (GameConfig.values.tickSeconds*1000));
  if(ticks <= 0) return null;
  let gain = 0;
  const mm = moraleMul();
  for(const id of state.buildings.kuang.workerIds){
    const d = getEntity(id);
    if(d) gain += producePer10s(d) * ticks * mm;
  }
  gain = Math.floor(gain);
  state.resources.lingshi += gain;
  // Task3: 离线灵药（和矿场一样公式，但无士气加成）
  let gainLY = 0;
  for(var i=0;i<state.buildings.yaotian.workerIds.length;i++){
    const d = getEntity(state.buildings.yaotian.workerIds[i]);
    if(d) gainLY += lingyaoPer10s(d) * ticks;
  }
  gainLY = Math.floor(gainLY);
  state.resources.lingyao = +(state.resources.lingyao + gainLY).toFixed(2);
  // Task4: 离线丹药（按批次消耗灵药避免负）
  const recipe = alchemyRecipe("danfang");
  var danfangPeople = state.buildings.danfang.workerIds.length;
  if(danfangPeople > 0 && recipe && recipe.lingyaoCostPerBatch > 0){
    // 先把药田累积的灵药算进来（上面刚加过）→ 然后按最多能炼几批砍
    const maxBatches = danfangPeople * ticks;
    var lingyaoNow = +state.resources.lingyao;
    const maxByIngredient = Math.floor(lingyaoNow / recipe.lingyaoCostPerBatch);
    const actualBatches = Math.min(maxBatches, Math.max(0, maxByIngredient));
    if(actualBatches > 0){
      state.resources.lingyao = +(lingyaoNow - actualBatches*recipe.lingyaoCostPerBatch).toFixed(2);
      state.resources.danyao  = +(state.resources.danyao  + actualBatches*recipe.pillPerBatch).toFixed(2);
    }
  }
  return { seconds:Math.floor(offlineMs/1000), gain, ticks, morale: mm>1, gainLY };
}

/* ===== 4. 弟子 / 掌门操作 ===== */
function genName(){ return H.genName(); }
function recruit(){
  if(state.disciples.length >= discipleCap()) return {ok:false, msg: GameConfig.ui.uiText.discipleCapFull || "弟子上限已满，请先升级宗门大殿"};
  const cost = GameConfig.values.recruit.cost;
  if(state.resources.lingshi < cost) return {ok:false, msg: GameConfig.ui.uiText.lingshiNotEnough || "灵石不足"};
  if(Date.now() < state.buildings.zhaomu.refreshCdEnd) return {ok:false, msg: GameConfig.ui.uiText.recruitCooldown || "招募冷却中，请稍候"};
  state.resources.lingshi -= cost;
  state.buildings.zhaomu.refreshCdEnd = Date.now() + recruitCdSec()*1000;
  const starterRealmId = GameConfig.realms.order[0];
  const starterRealm = GameConfig.realms.realms[starterRealmId];
  const d = {
    id:"d_"+(state.nextDiscipleId++),
    name:genName(),
    realm: starterRealm.name,
    level:1, exp:0,
    status:"idle", assignTo:null,
    base:{ root: 1.0 }
  };
  state.disciples.push(d);
  incQuestProgress("recruit_count", 1);
  saveGame();
  return {ok:true, disciple:d};
}
function renameEntity(id, newName){
  const d = getEntity(id);
  if(!d) return false;
  newName = (newName||"").trim();
  if(newName.length<1 || newName.length>6) return false;
  d.name = newName; saveGame(); return true;
}
/* ---- 通用分配 / 召回（Task3） ---- */
function assignToBuilding(id, bldKey, status){
  var d = getEntity(id);
  if(!d) return {ok:false,msg:"不存在"};
  if(d.status!=="idle") return {ok:false,msg: GameConfig.ui.uiText.workerAlreadyOnDuty || "该人员已在岗"};
  var b = state.buildings[bldKey];
  if(!b || !Array.isArray(b.workerIds)) return {ok:false,msg:"建筑没有工位"};
  var cap = bldSlotCap(bldKey);
  if(b.workerIds.length >= cap) return {ok:false, msg: buildingSlotsFullMsg(bldKey)};
  d.status = status; d.assignTo = bldKey;
  b.workerIds.push(d.id);
  saveGame(); return {ok:true};
}
function assignToKuang(id){ return assignToBuilding(id,"kuang","mining"); }
function recallEntity(id){
  var d = getEntity(id);
  if(!d) return {ok:false};
  if(!d.assignTo) return {ok:false};
  var b = state.buildings[d.assignTo];
  if(b && Array.isArray(b.workerIds)){
    b.workerIds = b.workerIds.filter(function(x){ return x!==id; });
  }
  d.status = "idle"; d.assignTo = null;
  saveGame(); return {ok:true};
}

/* ===== 5. 建筑升级 ===== */
function upgradeBuilding(key){
  const b = state.buildings[key];
  if(key!=="dian" && b.level >= state.buildings.dian.level) return {ok:false, msg: GameConfig.ui.uiText.buildingLockedHint || "需先升级宗门大殿"};
  const cost = upgradeCost(b.level);
  if(state.resources.lingshi < cost) return {ok:false, msg: GameConfig.ui.uiText.lingshiNotEnough || "灵石不足"};
  state.resources.lingshi -= cost;
  b.level++;
  incQuestProgress("upgrade_building", 1);
  if(key==="dian" && b.level===2){
    var uiT = GameConfig.ui.uiText;
    var txt = (uiT.newStageUnlockedNotice || "大殿升级到 Lv.2，解锁新资源！").replace(/\{LV\}/g, b.level);
    setTimeout(function(){ toast(txt); }, 50);
  }
  saveGame();
  return {ok:true};
}

/* ===== 6. 主循环（tickSeconds 按配置动态） ===== */
function tick(){
  const mm = moraleMul();
  // Task3: 灵石（记总量到 lsTotal，末尾用于 incQuestProgress）
  let lsTotal = 0;
  for(const id of state.buildings.kuang.workerIds){
    const d = getEntity(id);
    if(d) lsTotal += producePer10s(d) * mm;
  }
  state.resources.lingshi = +(state.resources.lingshi + lsTotal).toFixed(2);
  // Task3: 药田产灵药（无士气加成）
  var lyTotal = 0;
  for(var yi=0;yi<state.buildings.yaotian.workerIds.length;yi++){
    var d2 = getEntity(state.buildings.yaotian.workerIds[yi]);
    if(d2) lyTotal += lingyaoPer10s(d2);
  }
  state.resources.lingyao = +(state.resources.lingyao + lyTotal).toFixed(2);
  // Task4: 丹房 → 消耗灵药产丹药
  var recipe = alchemyRecipe("danfang");
  var alchemyWorkerCount = state.buildings.danfang.workerIds.length;
  var actualBatchesDone = 0;
  for(var aj=0;aj<alchemyWorkerCount;aj++){
    if(state.resources.lingyao >= recipe.lingyaoCostPerBatch){
      state.resources.lingyao = +(state.resources.lingyao - recipe.lingyaoCostPerBatch).toFixed(2);
      state.resources.danyao  = +(state.resources.danyao  + recipe.pillPerBatch).toFixed(2);
      actualBatchesDone++;
    }
  }
  // Task6: 资源任务累加
  incQuestProgress("collect_resource", {
    lingshi: lsTotal,
    lingyao: lyTotal,
    danyao: actualBatchesDone * recipe.pillPerBatch
  });
  // 掌门 + 弟子 经验（藏经阁加成）
  const all = [state.leader, ...state.disciples];
  var mul = cangjingExpMul();
  for(const d of all){
    if(!d) continue;
    const maxLv = H.maxLevel(realmCodeOfName(d.realm));
    if(d.level < maxLv){
      var addExp = GameConfig.values.idleExpPerTick * mul;
      d.exp += addExp;
      incQuestProgress("exp_sum", addExp);
      while(d.level < maxLv && d.exp >= H.expNeeded(realmCodeOfName(d.realm), d.level)){
        d.exp -= H.expNeeded(realmCodeOfName(d.realm), d.level);
        d.level++;
      }
    }else{
      d.exp = 0;
    }
  }
  ensureDailyQuests();
  saveGame();
}

function currentBuildingMode(){
  const tokens = GameConfig?.ui?.layoutTokens;
  if(!tokens) return "positional";
  const m = String(tokens.building_mode || "positional").toLowerCase();
  return (m==="flex" || m==="positional") ? m : "positional";
}
function applyCardStyle(el, styleObj){
  if(!styleObj || typeof styleObj!=="object") return;
  for(const [k,v] of Object.entries(styleObj)){
    if(k==="_comment" || v===null || v===undefined) continue;
    const cssKey = String(k).startsWith("--") ? k : k.replace(/[A-Z]/g, s=>"-"+s.toLowerCase());
    if(typeof v === "number" && !["zIndex","order","flexGrow","flexShrink"].includes(k)){
      el.style.setProperty(cssKey, v + "px");
    }else{
      el.style.setProperty(cssKey, String(v));
    }
  }
}
function renderBuildings(){
  const wrap = document.getElementById("buildings");
  if(!wrap) return;
  const mode = currentBuildingMode();
  wrap.className = "buildings " + (mode==="flex" ? "mode-flex" : "mode-positional");
  wrap.innerHTML = "";

    }
    if(key==="dian") sub += " · 弟子 "+state.disciples.length+"/"+discipleCap()+" （掌门不计）";
    if(key==="zhaomu"){
      const left = Math.max(0, Math.ceil((b.refreshCdEnd-Date.now())/1000));
      sub += left>0 ? " · 冷却 "+left+"s" : " · 可招募";
    }
    const el = document.createElement("div");
    const pos = m.position || {x:50,y:50,w:18,h:30};
    const lbl = (m.labelPosition || "bottom").toLowerCase();
    el.className = "b-card lbl-" + (["top","bottom","left","right"].includes(lbl)?lbl:"bottom");
    // 位置：x/y 是卡片中心的场景百分比，w/h 是卡片相对场景的尺寸百分比
    if(mode === "positional"){
      const w = (pos.w && pos.w>0) ? pos.w+"%" : defaultW;

function canBreakthrough(e){
  var realmCode = realmCodeOfName(e.realm);
  var meta = GameConfig.realms.realms[realmCode];
  if(!meta) return {ok:false,reason:"未知境界"};
  if(e.level < meta.maxLevel) return {ok:false,reason:"修炼中"};
  var bt = meta.breakthrough;
  if(!bt || !bt.nextRealm) return {ok:false,reason:"已是最高境界"};
  var need = bt.needPill || 0;
  if(state.resources.danyao < need) return {ok:false,reason:"danyao_not_enough",need:need};
  return {ok:true, needPill: need};
}
function openBreakthrough(entityId, extraAddInit){
  var e = getEntity(entityId);
  if(!e) return;
  var realmCode = realmCodeOfName(e.realm);
  var meta = GameConfig.realms.realms[realmCode];
  if(!meta || !meta.breakthrough) return;
  var bt = meta.breakthrough;
  var needBase = bt.needPill || 0;
  var addMax = (GameConfig.values.breakthrough && GameConfig.values.breakthrough.pillBoostAddMax!=null) ? GameConfig.values.breakthrough.pillBoostAddMax : 2;
  var failOffset = (GameConfig.values.breakthrough && GameConfig.values.breakthrough.failBackLevelOffset!=null) ? GameConfig.values.breakthrough.failBackLevelOffset : 1;
  var nextRealmId = bt.nextRealm;
  var nextMeta = GameConfig.realms.realms[nextRealmId];
  var nextRealmName = nextMeta ? nextMeta.name : (bt.nextRealm || "下一境");
  var uiT = GameConfig.ui.uiText;
  var avatar = e.isLeader ? leaderAvatarSrc() : (GameConfig.ui.images.discipleLianqi||"assets/img/disciple_lianqi.jpg");
  // 弹窗内部状态：window-level 暂存
  var stateKey = "_bt_" + entityId;
  if(extraAddInit==null) extraAddInit = 0;
  window[stateKey] = {extra: extraAddInit};
  function renderInner(){
    var cur = window[stateKey];
    var extra = cur.extra;
    if(extra < 0) extra = 0;
    if(extra > addMax) extra = addMax;
    cur.extra = extra;
    var rateRaw = breakthroughRate(realmCode, extra);
    var ratePct = Math.round(rateRaw*100);
    var totalPill = needBase + extra;
    var danyao = +state.resources.danyao || 0;
    var canConfirm = danyao >= totalPill;
    var titleText = (uiT.breakthroughTitle || "突破筑基").replace(/\{NEXT\}/g, nextRealmName);
    var pillsOptHtml = "";
    for(var i=0;i<=addMax;i++){
      var sel = (i===extra) ? ' style="border-color:var(--qing);font-weight:700;background:var(--qing);color:#fff;" ' : '';
      var r = Math.round(breakthroughRate(realmCode,i)*100);
      pillsOptHtml += '<button class="btn" style="padding:6px 10px;font-size:12px;margin-right:6px;"'+sel+'onclick="window[\''+stateKey+'\'].extra='+i+';_btRedraw(\''+entityId+'\')">'
                    + (i===0 ? (uiT.breakthroughPill0 || "基础") : ("+"+i))
                    + ' <small style="opacity:.85;">('+r+'%)</small></button>';
    }
    var breakthroughNeedTxt = (uiT.breakthroughNeed || "消耗 1 颗丹药（基础成功率 80%）")
      .replace(/\{BASE\}/g, needBase)
      .replace(/\{BASE_RATE\}/g, Math.round(breakthroughRate(realmCode,0)*100));
    var confirmTxt = uiT.breakthroughConfirm || "确认突破";
    var rateLabel = (uiT.breakthroughRateLabel || "突破成功率") + "：" + ratePct + "%";
    var totalLabel = (uiT.breakthroughTotalCost || "总共消耗") + "：" + totalPill + " 颗";
    var stockLabel = (uiT.danyaoStock || "丹药库存：") + Math.floor(danyao);
    var html =
      '<h2>'+titleText+'<button class="close" onclick="closeModal();delete window[\''+stateKey+'\'];">×</button></h2>'
      +'<div class="leader-banner">'
      +'<img src="'+avatar+'" alt="'+e.name+'">'
      +'<div class="r-name">'+e.name+(e.isLeader?' <span class="tag-gold">掌门</span>':'')+'</div>'
      +'<div class="r-sub">'+e.realm+'境 · Lv.'+e.level+' → '+nextRealmName+'境</div>'
      +'</div>'
      +'<div class="info-row"><span>'+(uiT.breakthroughCurrentPill || "当前丹药库存")+'</span><span>'+Math.floor(danyao)+'</span></div>'
      +'<div class="info-row"><span>'+(uiT.breakthroughBaseNeed || "基础需求")+'</span><span>'+breakthroughNeedTxt+'</span></div>'
      +'<div class="info-row"><span>'+(uiT.breakthroughExtraLabel || "额外吃丹药加成")+'</span><span>'+pillsOptHtml+'</span></div>'
      +'<div class="info-row"><span>'+(uiT.breakthroughRateLabel || "突破成功率")+'</span><span>'+ratePct+'% · '+totalLabel+'</span></div>'
      +'<button class="btn full '+(canConfirm?'':'gray')+'" '+(canConfirm?'onclick="_btDoConfirm(\''+entityId+'\')"':'disabled')+'>'+confirmTxt+'</button>'
      +'<span class="muted">'+(uiT.breakthroughTip || "温馨提示：多吃丹药可提升成功率，失败会小幅回退等级")+'</span>';
    document.getElementById("modal").innerHTML = html;
  }
  window["_btRedraw_"+entityId] = renderInner;
  window["_btDoConfirm_"+entityId] = function(){
    var cur = window[stateKey];
    var extra = cur.extra;
    var totalPill = needBase + extra;
    if((+state.resources.danyao||0) < totalPill){ toast(uiT.lingshiNotEnough ? "" : ""); return; }
    state.resources.danyao = +(+state.resources.danyao - totalPill).toFixed(2);
    var rate = breakthroughRate(realmCode, extra);
    var success = Math.random() < rate;
    if(success){
      e.realm = nextRealmName;
      e.level = 1;
      e.exp = 0;
      var okText = (uiT.breakthroughSuccess || "🎉 突破成功，进入筑基境！").replace(/\{NEXT\}/g, nextRealmName);
      toast(okText);
    } else {
      e.level = Math.max(1, meta.maxLevel - failOffset);
      e.exp = 0;
      var failText = uiT.breakthroughFail || "💧 突破失败，境界小退一步，再努力修炼吧！";
      toast(failText);
    }
    saveGame();
    delete window[stateKey];
    delete window["_btRedraw_"+entityId];
    delete window["_btDoConfirm_"+entityId];
    closeModal();
    render();
    if(e.isLeader) setTimeout(openLeaderDetail, 60);
    else setTimeout(function(){ openDiscipleDetail(e.id); }, 60);
  };
  window._btRedraw = function(id){ if(window["_btRedraw_"+id]) window["_btRedraw_"+id](); };
  window._btDoConfirm = function(id){ if(window["_btDoConfirm_"+id]) window["_btDoConfirm_"+id](); };
  openModal("");
  renderInner();
}

/* ---- 头像压缩上传（所有参数都走 values.json avatar.compress）---- */
function setupAvatarHandler(){
  fileInput = document.getElementById("fileUpload");
  fileInput.addEventListener("change", e=>{
    const f = e.target.files[0];
    fileInput.value="";
    if(!f) return;
    const C = GameConfig.values.avatar.compress;
    const RAW_MAX = C.rawFileMaxKB * 1024;
    if(f.size > RAW_MAX){
      toast(`图片过大（${Math.round(f.size/1024/1024)}MB），请选择 ≤${C.rawFileMaxKB/1024}MB 的图片`);
      return;
    }
    const reader = new FileReader();
    reader.onerror = ()=>toast("读取失败，请换一张图片");
    reader.onload = evt=>{
      const img = new Image();
      img.onerror = ()=>toast("图片格式不支持，请换一张");
      img.onload = ()=>{
        compressAvatar(img, 0, ok=>{
          if(!ok){ toast("压缩失败，请换更小的图片"); return; }
          saveGame();
          render();
          const da = document.getElementById("leaderDetailAvatar");
          if(da) da.src = state.leader.avatarDataUrl;
          const kb = Math.round(state.leader.avatarDataUrl.length/1024*3/4);
          toast("头像更换成功（已压缩至 ~"+kb+"KB）");
        });
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(f);
  });
}
function compressAvatar(img, step, cb){
  const C = GameConfig.values.avatar.compress;
  const qualities = C.qualitySteps;
  const MAX_DATAURL_CHARS = C.dataUrlMaxKB * 1024 * 4/3 + 2000;  // DataURL 字符上限（安全边界）
  let w = img.naturalWidth, h = img.naturalHeight;
  if(w > C.maxSide || h > C.maxSide){
    const r = Math.min(C.maxSide/w, C.maxSide/h);
    w = Math.round(w*r); h = Math.round(h*r);
  }
  const q = qualities[Math.min(step, qualities.length-1)];
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,w,h);
  ctx.drawImage(img, 0, 0, w, h);
  const url = canvas.toDataURL("image/jpeg", q);
  if(url.length <= MAX_DATAURL_CHARS){
    state.leader.avatarDataUrl = url;
    cb(true);
    return;
  }
  if(step < qualities.length-1){
    compressAvatar(img, step+1, cb);
  }else{
    // 最终兜底：再缩尺寸
    const w2 = Math.min(w, C.fallbackSide), h2 = Math.min(h, C.fallbackSide);
    const c2 = document.createElement("canvas");
    c2.width = w2; c2.height = h2;
    const cx = c2.getContext("2d");
    cx.fillStyle="#fff"; cx.fillRect(0,0,w2,h2);
    cx.drawImage(img, 0, 0, w2, h2);
    const url2 = c2.toDataURL("image/jpeg", C.fallbackQuality);
    state.leader.avatarDataUrl = url2;
    cb(true);
  }
}

/* ===== 10bis. 日常任务（Task6） ===== */
function todayStr(){
  var d = new Date();
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function resName(id){ var r = GameConfig.resources.resources[id]; return r? r.name : id; }
function formatNeed(n){ return Math.floor(n); }
function questTitle(q){
  var uiT = GameConfig.ui.uiText;
  switch(q.type){
    case "collect_resource":
      var tpl = uiT.questCollectResourceTitle || "收集 {AMOUNT} {RES}";
      return tpl.replace(/\{AMOUNT\}/g, formatNeed(q.need)).replace(/\{RES\}/g, resName(q.resource));
    case "upgrade_building":
      return (uiT.questUpgradeTitle || "升级 {N} 次建筑").replace(/\{N\}/g, formatNeed(q.need));
    case "exp_sum":
      return (uiT.questExpTitle || "弟子/掌门累计修炼 {N} 经验").replace(/\{N\}/g, formatNeed(q.need));
    case "recruit_count":
      return (uiT.questRecruitTitle || "招募 {N} 名新弟子").replace(/\{N\}/g, formatNeed(q.need));
    default: return "任务 "+q.id;
  }
}
function ensureDailyQuests(){
  if(!state || !GameConfig) return;
  var today = todayStr();
  if(!state.quests || typeof state.quests!=="object" || state.quests.date !== today){
    var pool = (GameConfig.values.quests && GameConfig.values.quests.dailyPool) ? GameConfig.values.quests.dailyPool.slice() : [];
    for(var i=pool.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    var dailyCount = (GameConfig.values.quests && typeof GameConfig.values.quests.dailyCount==="number") ? GameConfig.values.quests.dailyCount : 3;
    var n = Math.max(1, Math.min(dailyCount, pool.length));
    var list = [];
    for(var k=0;k<n;k++){
      var q = pool[k];
      list.push({
        id: q.id, type: q.type, resource: q.resource,
        title: questTitle(q),
        need: q.need, progress: 0, claimed: false,
        reward: JSON.parse(JSON.stringify(q.reward || {}))
      });
    }
    state.quests = { date: today, list: list };
    saveGame();
  }
}
function incQuestProgress(type, arg){
  if(!state || !state.quests || !Array.isArray(state.quests.list)) return;
  var list = state.quests.list;
  function addOne(q, amt){
    if(!amt || isNaN(+amt)) return;
    q.progress = Math.min(q.need, (+q.progress) + (+amt));
  }
  if(type==="collect_resource"){
    var map = arg || {};
    for(var i=0;i<list.length;i++){
      var q = list[i];
      if(q.claimed || q.type!=="collect_resource") continue;
      var v = map[q.resource];
      if(v!=null) addOne(q, v);
    }
  }else if(type==="upgrade_building"){
    var a = (typeof arg==="number") ? arg : 1;
    for(var i=0;i<list.length;i++){
      var q = list[i];
      if(q.claimed || q.type!=="upgrade_building") continue;
      addOne(q, a);
    }
  }else if(type==="exp_sum"){
    var amt = (typeof arg==="number") ? arg : 0;
    for(var i=0;i<list.length;i++){
      var q = list[i];
      if(q.claimed || q.type!=="exp_sum") continue;
      addOne(q, amt);
    }
  }else if(type==="recruit_count"){
    var a2 = (typeof arg==="number") ? arg : 1;
    for(var i=0;i<list.length;i++){
      var q = list[i];
      if(q.claimed || q.type!=="recruit_count") continue;
      addOne(q, a2);
    }
  }
}

function openQuests(){
  ensureDailyQuests();
  var uiT = GameConfig.ui.uiText;
  var today = state.quests.date || todayStr();
  var contrib = +(state.resources.contribution || 0);
  var contribBadgeTpl = uiT.questsContributionBadge || "宗门贡献：";
  var titleTpl = (uiT.questsTitle || "今日任务").replace(/\{DATE\}/g, today);
  var html = '<h2>'+titleTpl+' <span class="sect-level" style="font-size:12px;">'+contribBadgeTpl+Math.floor(contrib)+'</span><button class="close" onclick="closeModal()">×</button></h2>';
  html += '<div class="m-sub" style="margin-bottom:8px;">'+today+'</div>';
  if(!state.quests.list || state.quests.list.length===0){
    html += '<div class="d-empty">'+(uiT.questsEmptyHint || "今日任务还未生成，请刷新重试")+'</div>';
    openModal(html);
    return;
  }
  for(var i=0;i<state.quests.list.length;i++){
    var q = state.quests.list[i];
    var p = +q.progress;
    var nd = +q.need;
    var pct = Math.min(100, Math.floor(p/nd*100));
    var progressLabelTpl = (uiT.questsProgressLabel || "进度：{P}/{N}").replace(/\{P\}/g, Math.floor(p)).replace(/\{N\}/g, formatNeed(nd));
    var rewardHtml = renderQuestRewardPreview(q.reward);
    var statusBtn = "";
    if(q.claimed){
      statusBtn = '<button class="btn full gray" disabled>'+(uiT.questsClaimed || "✅ 已领")+'</button>';
    }else if(p >= nd){
      statusBtn = '<button class="btn full" onclick="claimQuestReward(\''+q.id+'\')">'+(uiT.questsRewardBtn || "🎁 领取")+'</button>';
    }else{
      statusBtn = '<button class="btn full gray" disabled>'+(uiT.questsDoing || "⏳ 进行中")+'</button>';
    }
    html += '<div class="card-block">'
          + '<h3 style="display:flex;justify-content:space-between;align-items:center;">'
          + '<span>'+(q.title || questTitle(q))+'</span>'
          + '<small style="font-weight:500;color:#6a7a86;">'+progressLabelTpl+'</small>'
          + '</h3>'
          + '<div class="quest-bar" style="margin:6px 0 8px;"><div class="fill" style="width:'+pct+'%;"></div></div>'
          + '<div style="font-size:12px;color:#6a7a86;margin-bottom:6px;">'+(uiT.questRewardLabel || "奖励")+'：'+rewardHtml+'</div>'
          + statusBtn
          + '</div>';
  }
  openModal(html);
}
function renderQuestRewardPreview(reward){
  var uiT = GameConfig.ui.uiText;
  var res = GameConfig.resources.resources || {};
  var keys = Object.keys(reward||{});
  if(keys.length===0) return "";
  var parts = [];
  for(var i=0;i<keys.length;i++){
    var k = keys[i];
    var v = reward[k];
    if(!v) continue;
    var meta = res[k] || {name:k,img:""};
    parts.push('<span style="display:inline-flex;align-items:center;gap:3px;margin-right:8px;">'
              +(meta.img?'<img src="'+meta.img+'" style="width:14px;height:14px;vertical-align:middle;">':"")
              +(meta.name||k)+" "+Math.floor(v)+'</span>');
  }
  return parts.join(" ");
}
function claimQuestReward(qid){
  var found = null;
  if(!state.quests || !state.quests.list) return;
  for(var i=0;i<state.quests.list.length;i++){
    if(state.quests.list[i].id===qid){ found = state.quests.list[i]; break; }
  }
  if(!found) return;
  if(found.claimed) return;
  if((+found.progress) < (+found.need)) return;
  var uiT = GameConfig.ui.uiText;
  var reward = found.reward || {};
  var parts = [];
  var keys = Object.keys(reward);
  for(var i=0;i<keys.length;i++){
    var k = keys[i];
    var v = +reward[k]||0;
    if(!v) continue;
    if(typeof state.resources[k]!=="number") state.resources[k] = 0;
    state.resources[k] = +(state.resources[k] + v).toFixed(2);
    parts.push((GameConfig.resources.resources[k]?GameConfig.resources.resources[k].name:k)+"+"+Math.floor(v));
  }
  found.claimed = true;
  saveGame();
  var tpl = uiT.questRewardClaimed || "奖励已领取：{ITEMS}";
  toast(tpl.replace(/\{ITEMS\}/g, parts.join("，")));
  render();
  openQuests();
}

    // UI 尺寸 tokens 注入（顶栏/底栏/建筑/弹窗尺寸 → --l-* CSS 变量）
    window.GameConfigLoader.injectLayoutTokens(GameConfig.ui.layoutTokens);
    // 根据 scene_bg_fixed 决定背景是否 fixed 到 body（默认 true），false 时把整个图贴到 #scene 节点对齐建筑 position
    if(GameConfig.ui.layoutTokens.scene_bg_fixed === false){
      document.body.style.background = "#cfe8e1";
      const scene = document.getElementById("scene");
      if(scene){
        scene.style.background = `#cfe8e1 url("${GameConfig.ui.images.sceneBg}") center/cover no-repeat`;
      }
    }
    // 渲染前挂好上传句柄
    setupAvatarHandler();
    setupSaveImportHandler();
    // 状态初始化
    state = loadGame();
    let offlineResult = null;
    if(!state){
      state = newGame();
      saveGame();
    }else{
      offlineResult = settleOffline();
      saveGame();
    }
    render();
    // 启动 tick（按配置的 tickSeconds）
    setInterval(tick, GameConfig.values.tickSeconds * 1000);
    setInterval(render, 1000);
    setInterval(()=>{
      if(!document.getElementById("overlay").classList.contains("show")) renderBuildings();
    }, 1000);
    // 离线收益弹窗
    if(offlineResult && offlineResult.gain>0){
      const mins = Math.floor(offlineResult.seconds/60);
      const secs = offlineResult.seconds%60;
      const morale = offlineResult.morale ? "（掌门在岗加成生效）" : "";
      setTimeout(()=>openModal(`
        <h2>欢迎回来<button class="close" onclick="closeModal()">×</button></h2>
        <div class="recruit-result">
          <img src="${GameConfig.ui.images.iconLingshi}" style="border-radius:12px" alt="灵石">
          <div class="r-name">+${offlineResult.gain} 灵石</div>
          <div class="m-sub">离线 ${mins}分${secs}秒 · 矿场自动采集${morale}</div>
        </div>
        <button class="btn full" onclick="closeModal()">收下</button>
      `),300);
    }
    running = true;
    // 控制台暴露配置，方便孩子 F12 试玩：改 GameConfig.values.initLingshi 不会即时生效，改 .produce.basePer10s 等会在下次 tick 生效
    // 正式改请改对应 JSON 文件然后刷新页面
    console.log("[宗门] 配置加载完成：", {
      usedFallback: loadDiagnostics.usedFallback,
      sources: loadDiagnostics.sourceMap,
      warnings: loadDiagnostics.warnings,
      tip: "改数值请直接编辑 /workspace/assets/config/*.json，然后刷新页面。F12 控制台可临时改 GameConfig.values 做数值实验。"
    });
  }catch(err){
    console.error(err);
    openModal(`<h2>配置加载失败<button class="close" onclick="closeModal()">×</button></h2>
      <div class="m-sub">请打开浏览器控制台查看详细错误</div>
      <div class="hint-warn">${String(err.message||err)}</div>`);
  }
}
// DOM 解析完成后启动
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", bootstrap);
}else{
  bootstrap();
}
// overlay 点击外部关闭
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeModal(); });
});
</script>
</body>
</html>
